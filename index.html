<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>

<body>
    <div class="greetings">
        <span>H</span>
        <span>o</span>
        <span>l</span>
        <span>a</span>
        <span>!</span>
    </div>

    <div class="description">
        <span>ESTE DETALLE ES PARA TI :)</span>
        <span id="nombre-usuario" style="display:block;color:#fff;font-size:2em;margin-top:0.5em;"></span>
    </div>

    <div class="button">
        <button class="botones">
            <a id="link-flower" href="flower.html" style="color: #fff;">CLICK AQUÍ</a>
        </button>
    </div>

    <!-- Script para manejar query params -->
    <script>
        // Obtener los parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get("nombre");
        const variant = params.get("variant");

        // Mostrar nombre en el span si existe
        if (nombre) {
            document.getElementById("nombre-usuario").textContent = decodeURIComponent(nombre);
        }

        // Construir URL de destino con los parámetros presentes
        const targetParams = new URLSearchParams();
        if (nombre) targetParams.set("nombre", nombre);
        if (variant) targetParams.set("variant", variant);

        const link = document.getElementById("link-flower");
        if (link && targetParams.toString()) {
            link.href = `flower.html?${targetParams.toString()}`;
        }
    </script>
</body>

</html>

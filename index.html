<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Día de las Flores Amarillas 🌻</title>
    <meta name="description" content="Alguien especial te ha enviado un detalle. Toca para abrir tu sorpresa 💛">
    <!-- Fallback Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="🌻 ¡Un detalle especial de Flores Amarillas para ti! ✨">
    <meta property="og:description" content="Toca aquí para abrir tu sorpresa y descubrir tu dedicatoria 💛">
    <meta property="og:image" content="https://flores.eulisesbrazon.com/api/og">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🌻 ¡Un detalle especial de Flores Amarillas para ti! ✨">
    <meta name="twitter:description" content="Toca aquí para abrir tu sorpresa y descubrir tu dedicatoria 💛">
    <meta name="twitter:image" content="https://flores.eulisesbrazon.com/api/og">
</head>

<body>
    <div class="greetings">
        <span>H</span>
        <span>o</span>
        <span>l</span>
        <span>a</span>
        <span>!</span>
    </div>

    <div class="description">
        <span>ESTE DETALLE ES PARA TI :)</span>
        <span id="nombre-usuario"></span>
    </div>

    <div class="button">
        <a id="link-flower" class="boton-enlace" href="flower.html">CLICK AQUÍ</a>
    </div>

    <!-- Script para manejar query params -->
    <script>
        // Obtener los parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get("nombre");
        const variant = params.get("variant");

        // Mostrar nombre en el span si existe
        if (nombre) {
            document.getElementById("nombre-usuario").textContent = decodeURIComponent(nombre);
        }

        // Construir URL de destino con los parámetros presentes
        const targetParams = new URLSearchParams();
        if (nombre) targetParams.set("nombre", nombre);
        if (variant) targetParams.set("variant", variant);

        const link = document.getElementById("link-flower");
        if (link && targetParams.toString()) {
            link.href = `flower.html?${targetParams.toString()}`;
        }
    </script>
</body>

</html>

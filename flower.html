    </div>

    <div class="night"></div>
    <script>
      // Control de música robusto y adaptado para móviles
      const audio = document.getElementById('flores-audio');
      const musicBtn = document.getElementById('music-toggle-btn');
      const musicIcon = document.getElementById('music-icon');
      const musicLabel = document.getElementById('music-label');

      function updateMusicUI(isPlaying) {
        if (!musicBtn) return;
        if (isPlaying) {
          musicBtn.classList.add('is-playing');
          if (musicIcon) musicIcon.textContent = '🎵';
          if (musicLabel) musicLabel.textContent = 'Sonando';
        } else {
          musicBtn.classList.remove('is-playing');
          if (musicIcon) musicIcon.textContent = '🔇';
          if (musicLabel) musicLabel.textContent = 'Pausa';
        }
      }

      if (audio && musicBtn) {
        musicBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            audio.play().then(() => updateMusicUI(true)).catch(() => {});
          } else {
            audio.pause();
            updateMusicUI(false);
          }
        });

        // Intentar reproducción automática
        audio.play().then(() => {
          updateMusicUI(true);
        }).catch(() => {
          // Si el navegador móvil bloquea autoplay con sonido, se activa al primer toque en la pantalla
          updateMusicUI(false);
          const startAudioOnTouch = () => {
            if (audio.paused) {
              audio.play().then(() => updateMusicUI(true)).catch(() => {});
            }
            window.removeEventListener('pointerdown', startAudioOnTouch);
            window.removeEventListener('touchstart', startAudioOnTouch);
          };
          window.addEventListener('pointerdown', startAudioOnTouch, { passive: true });
          window.addEventListener('touchstart', startAudioOnTouch, { passive: true });
        });
      }
    </script>
    <script>
        // Obtener los parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get("nombre");

        // Mostrar nombre en el span si existe
        if (nombre) {
            const decoded = decodeURIComponent(nombre);
            const nombreSpan = document.getElementById("nombre-usuario");
            if (nombreSpan) {
              nombreSpan.textContent = decoded;
            }

            const bouquetName = document.getElementById("bouquet-name");
            if (bouquetName) {
              bouquetName.textContent = decoded;
            }

            const link = document.getElementById("link-flower");
            if (link) {
              link.href = `flower.html?nombre=${encodeURIComponent(nombre)}`;
            }
        }
    </script>
